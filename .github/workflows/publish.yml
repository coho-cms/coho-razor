name: Publish

# Publishes CohoCms.Razor to nuget.org, at the version in Directory.Build.props. Bump it,
# merge, then run this by hand from the version branch. A version cannot be published twice,
# so every fix is a new version.
#
# Trusted Publishing: nuget.org trusts this workflow file in this repository, by a policy
# the CohoCMS organisation holds, and gives it a key for an hour. No key is stored here.
# NUGET_USER is the nuget.org user the policy was created by.
on:
  workflow_dispatch:

permissions:
  contents: read
  # For the token nuget.org exchanges for a short-lived key.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - name: Test
        run: dotnet test --no-build -c Release
        env:
          DOTNET_ROLL_FORWARD: LatestPatch
      - run: dotnet pack --no-build -c Release -o artifacts
      - name: Sign in to nuget.org
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      # The symbol package beside it goes up with it.
      - name: Publish
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "$KEY" --source https://api.nuget.org/v3/index.json
        env:
          KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
